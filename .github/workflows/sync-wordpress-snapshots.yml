name: Sync WordPress snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: gamblee-wordpress-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh snapshots
        env:
          GAMBLEE_SOURCE_URL: https://www.gamblee.com
        run: python tools/sync_wordpress_snapshots.py

      - name: Commit changed snapshots
        shell: bash
        run: |
          git add authoring-contract.json vocabulary/ bonuses/ promotions/ events/
          if [ -f coverage-index.json ]; then
            git add coverage-index.json
          fi

          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git config user.name "gamblee-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync Gamblee contract snapshots"
          git push
